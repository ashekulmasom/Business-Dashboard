<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Market Service · গাজীপুর সেন্ট্রাল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* ---- ফন্ট: ইংরেজি = Calibri (ফোনে Carlito); বাংলা = একটি ফন্ট পরিবার — রিপোজিটরিতে font-bangla.ttf (সাধারণ) ও font-bangla-bold.ttf (বোল্ড) রাখুন ---- */
@font-face{font-family:"ACBangla";src:url("font-bangla.woff2") format("woff2"),url("font-bangla.ttf") format("truetype");font-weight:400;font-display:swap;unicode-range:U+0980-09FF,U+200C-200D,U+25CC}
/* ইংরেজি লেখা ও সংখ্যা: কম্পিউটারে থাকা Calibri, না থাকলে (ফোনে) Carlito — একই মাপের ফ্রি ফন্ট */
@font-face{font-family:"ACLatin";src:local("Calibri"),local("Calibri Regular");font-weight:400;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"ACLatin";src:local("Calibri Bold"),local("Calibri-Bold");font-weight:700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"ACBangla";src:url("font-bangla-bold.woff2") format("woff2"),url("font-bangla-bold.ttf") format("truetype"),url("font-bangla.ttf") format("truetype");font-weight:700;font-display:swap;unicode-range:U+0980-09FF,U+200C-200D,U+25CC}
:root{
  --pink:#E2136E;--pink2:#FF4F9A;--deep:#7A0C43;--plum:#3B0A26;--gold:#F2B705;--gold2:#FFE08A;
  --bg:#FBF5F8;--card:#FFFFFF;--line:#F1DCE7;--ink:#24121C;--mut:#6B5561;--ok:#0B7A6E;--low:#A34A00;
  --fh:"ACLatin","Carlito","ACBangla","Hind Siliguri",sans-serif;
  --fb:"ACLatin","Carlito","ACBangla","Hind Siliguri",sans-serif;
  --sh:0 1px 2px rgba(59,10,38,.05),0 8px 24px rgba(59,10,38,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--fb);background:var(--bg);min-height:100vh;
  background-image:radial-gradient(900px 400px at 0% -10%,#FFE1EF 0,transparent 60%),radial-gradient(700px 360px at 100% 0%,#FFF1CF 0,transparent 55%)}
h1,h2,h3,.fh{font-family:var(--fh);letter-spacing:.005em}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
/* ---- হিরো ---- */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:22px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:linear-gradient(115deg,var(--plum) 0%,var(--deep) 38%,var(--pink) 100%);box-shadow:0 18px 40px rgba(122,12,67,.28)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,224,138,.35),transparent 35%),repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.badge{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-3deg)}
.badge img{height:70px;display:block}
.kick{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{margin:0;font-size:32px;line-height:1.2;font-weight:700}
.hero p{margin:4px 0 0;font-size:15px;opacity:.95}
.till{display:inline-block;font:500 12.5px/1.4 var(--fb);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 12px;margin-top:6px}
.hero .side{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.hero select{min-height:40px;width:auto;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 12px;font:600 14px var(--fb)}
.hero select option{color:#1B1B1F}
.sp{position:absolute;color:var(--gold2);animation:tw 2.4s ease-in-out infinite;pointer-events:none;font-size:18px;z-index:1}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
/* ---- নেভিগেশন ---- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
nav.tabs a{padding:8px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--deep);font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;box-shadow:var(--sh)}
nav.tabs a.on{background:var(--pink);border-color:var(--pink);color:#fff}
.who{font-size:14px;color:var(--mut);margin-left:auto;display:flex;gap:8px;align-items:center}
/* ---- প্যানেল ও কার্ড ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--sh)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:22px;margin:0;line-height:1.3;color:var(--plum)}
.mut{color:var(--mut);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;transition:transform .2s,box-shadow .2s;position:relative;color:inherit;text-decoration:none;display:block;box-shadow:var(--sh)}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(122,12,67,.14)}
.card .ic{font-size:24px}
.card b.big{display:block;font:700 34px/1.15 var(--fh);color:var(--plum)}
.card.me{background:linear-gradient(135deg,#FFF0F7,#FFF8E2);border:2px solid var(--pink)}
.card .more{margin-top:8px;color:var(--pink);font-weight:700;font-size:14px}
.msg{margin-top:8px;font-weight:600;color:var(--deep);font-size:14.5px}
/* ---- আমার ড্যাশবোর্ড ---- */
.mine-grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.mine-grid{grid-template-columns:1fr}}
.scorebox{border-radius:22px;padding:20px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--plum),var(--deep) 55%,var(--pink));position:relative;overflow:hidden}
.scorebox::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,224,138,.35),transparent 40%);pointer-events:none}
.scorebox>*{position:relative}
.ring{--p:0;width:168px;height:168px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.ring>div{width:136px;height:136px;border-radius:50%;background:var(--plum);display:grid;place-items:center;align-content:center}
.ring b{font:700 42px/1 var(--fh)}
.ring small{font-size:12px;opacity:.8}
.tier{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:rgba(255,255,255,.12);border-radius:14px;padding:8px 4px}
.kpis b{display:block;font:700 22px/1.1 var(--fh)}
.kpis span{font-size:12px;opacity:.85}
.plist{display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:center}
@media (max-width:560px){.prow{grid-template-columns:1fr auto}.prow .pb{grid-column:1/-1;order:3}}
.prow .pn{font:700 16px/1.2 var(--fh);color:var(--plum)}
.prow .pn small{display:block;font:400 12px var(--fb);color:var(--mut)}
.pb{height:12px;background:#F6E6EF;border-radius:999px;position:relative;overflow:visible}
.pb i{display:block;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold))}
.pb em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--plum);opacity:.45;left:var(--m)}
.prow .pv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .pv b{font:700 18px var(--fh)}
.prow .pv small{display:block;font-size:12px;color:var(--mut)}
.prow .todo{grid-column:1/-1;font-size:13.5px;color:var(--deep);background:#FFF7E0;border-radius:10px;padding:6px 10px}
.prow.done .todo{background:#E6F6F3;color:var(--ok)}
/* ---- মোটিভেশন ---- */
.mot{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
@media (max-width:820px){.mot{grid-template-columns:1fr}}
.quote{border-radius:20px;padding:18px 20px;background:linear-gradient(135deg,#FFF4D6,#FFE7F2);border:1px solid #F7D9A0;font:600 18px/1.5 var(--fh);color:var(--plum);display:flex;gap:12px;align-items:center}
.quote span{font-size:34px}
.stat{border-radius:20px;padding:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.stat b{display:block;font:700 30px/1.1 var(--fh);color:var(--pink)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bd{display:flex;gap:8px;align-items:center;border-radius:14px;padding:8px 12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.bd i{font-style:normal;font-size:22px}
.bd.off{opacity:.42;filter:grayscale(1)}
.bd.on{border-color:var(--gold);background:linear-gradient(135deg,#FFFBEA,#FFF0F7);box-shadow:0 4px 12px rgba(242,183,5,.2)}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ch{border-radius:16px;padding:12px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#FFF7FB)}
.ch .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ch b{display:block;font:700 16px/1.3 var(--fh);color:var(--plum);margin-top:2px}
.ch span{font-weight:700;color:var(--pink)}
/* ---- ফর্ম ও বোতাম ---- */
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid #DCC2D0;border-radius:12px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #FFC2DC;border-color:var(--pink)}
button,a.btn{min-height:48px;border-radius:999px;padding:10px 22px;font:700 15px var(--fb);cursor:pointer;border:2px solid var(--pink);background:var(--pink);color:#fff;transition:transform .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,a.btn:hover{transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.ghost,a.btn.ghost{background:#fff;color:var(--pink)}
.hero button.ghost{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;min-height:40px;padding:6px 16px}
button.sm{min-height:36px;padding:4px 12px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}.filters>div{flex:1 1 220px}
/* ---- টেবিল ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:660px;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:12.5px;color:var(--mut);padding:9px 10px;white-space:nowrap;vertical-align:bottom;background:#FCF4F8;font-weight:700}
th small{display:block;font-weight:400;font-size:10.5px;opacity:.85}
td{padding:10px;border-top:1px solid #F4E5ED;text-align:right}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.l small{display:block;color:var(--mut);font-size:12px}
tr:hover td{background:#FFF6FA}
tr.go{cursor:pointer}
tr.top td{background:#FFF8E1}
tr.mine td{background:#FFE3EF}tr.mine td:first-child{box-shadow:inset 5px 0 0 var(--pink)}
tr.tot td{background:#FCF4F8;font-weight:700}
td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--pink)}
td b{font-family:var(--fh)}
.hi{color:var(--ok);font-weight:700}.lo{color:var(--low)}
.bar{height:6px;background:#F4E1EB;border-radius:3px;margin-top:3px;min-width:70px}.bar i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--gold))}
.rk{font-size:20px;line-height:1;white-space:nowrap}
.dhh{margin:22px 0 8px;font:700 19px var(--fh);color:var(--deep)}
.tchip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle}
.tchip.pt{background:#E8F0FF;color:#2B4C9B}.tchip.gd{background:#FFF1C2;color:#8A5A00}.tchip.sv{background:#EEF0F3;color:#4B5563}.tchip.bz{background:#F8E5D6;color:#8A4B16}
/* ---- পোডিয়াম ---- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:12px 0 18px;flex-wrap:nowrap}
.pd{flex:1 1 0;max-width:220px;text-align:center;min-width:0}
.pd .medal{font-size:36px;animation:bob 3s ease-in-out infinite}
.pd .pn{font:700 15px/1.25 var(--fh);overflow-wrap:anywhere;color:var(--plum)}
.pd .ps{font:700 22px var(--fh);color:var(--pink)}
.pd .step{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#1B1B1F;font:700 22px var(--fh)}
.p1 .step{height:96px;background:linear-gradient(#FFE38A,#F2B705)}.p2 .step{height:70px;background:linear-gradient(#F1F3F6,#C4CAD2)}.p3 .step{height:54px;background:linear-gradient(#F4CDA6,#D99A62)}
.pd.mine .pn{color:var(--pink)}
/* ---- অন্যান্য ---- */
.gate{max-width:500px;margin:30px auto 0}
.err{color:#B00020;font-size:15px;margin:10px 0 0;min-height:22px;font-weight:600}
.how{background:#FFF8E1;border:1px solid #F5DFA0;border-radius:16px;padding:14px 18px;margin:14px 0}
.how b{color:var(--deep)}
.how ul{margin:6px 0 0;padding-left:20px}
.how li{margin:3px 0;font-size:14.5px}
.need{font-weight:700;color:var(--deep)}
.seg{display:inline-flex;border:2px solid var(--pink);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;background:#fff;color:var(--pink);min-height:42px}
.seg button.on{background:var(--pink);color:#fff}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;font-weight:700;background:#FFE3F0;color:var(--deep)}
footer.ft{text-align:center;color:var(--mut);font-size:12.5px;padding:18px 0 8px}
footer.ft a{color:var(--mut)}
.cf{position:fixed;top:-16px;width:10px;height:14px;z-index:9;animation:fall 3.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.hero h1{font-size:24px}.badge img{height:54px}.hero{padding:18px}.hero .side{margin-left:0}.panel{padding:16px}.ring{width:150px;height:150px}.ring>div{width:122px;height:122px}}

.pnote{font-size:12px;color:var(--deep);font-weight:600;line-height:1.35;margin:2px 4px 4px}
.reward{border-radius:16px;padding:10px 16px;margin-bottom:10px;background:linear-gradient(90deg,#FFF3C4,#FFE3F0);border:1px solid #F2C94C;font:700 16px var(--fh);color:var(--plum);text-align:center}
/* ---- স্কোর কার্ড: নাম ও লিডার ---- */
.sb-name{font:800 26px/1.2 var(--fh);margin:2px 0 4px;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.tier.leader{font:800 18px/1.3 var(--fh);padding:6px 18px;color:var(--plum);background:linear-gradient(90deg,#FFE58A,#F2B705);border:0;box-shadow:0 6px 18px rgba(242,183,5,.35)}
.sb-link{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#FFE9A8;text-decoration:none;border-bottom:1px dashed rgba(255,233,168,.6);padding-bottom:1px}
.sb-link:hover{color:#fff}
/* ---- ১ নম্বরের দৌড় ---- */
.race{border-radius:20px;padding:16px 18px 14px;background:linear-gradient(135deg,#2A0719,#5B0B33 60%,#8E1050);color:#fff;position:relative;overflow:hidden}
.race::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,5,.35),transparent 70%);pointer-events:none}
.race>*{position:relative;z-index:1}
.rk2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#FFD86B;font-weight:700}
.rbig{font:700 22px/1.25 var(--fh);margin-top:2px}.rbig b{color:#FFD86B;font-size:30px}
.rsub{font-size:13px;opacity:.85}
.track{position:relative;height:44px;margin:16px 6px 4px}
.lane{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px;background:rgba(255,255,255,.16)}
.lane i{display:block;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--pink2),var(--gold))}
.dot{position:absolute;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(42,7,25,.6)}
.dot.me{width:20px;height:20px;top:14px;margin-left:-10px;background:var(--pink2);border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,79,154,.35);animation:pulse 1.8s ease-in-out infinite}
.dot.lead{width:20px;height:20px;top:14px;margin-left:-10px;background:var(--gold);border:3px solid #fff}
.dot em{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:700 11.5px var(--fb);font-style:normal;white-space:nowrap;background:#fff;color:var(--plum);border-radius:999px;padding:0 7px}
.dot.me em{top:22px;bottom:auto;background:var(--pink2);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,79,154,0)}}
.levers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.lv-h{font-size:12.5px;font-weight:700;color:#FFD86B;margin-right:2px}
.lever{font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 10px}
.lever i{font-style:normal;font-weight:700;color:#FFD86B;margin-left:4px}
.lv-more{font-size:12.5px;color:#FFE9A8;margin-left:auto}
/* ---- আজকের লক্ষ্য: ছোট টাইল ---- */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.kt{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.kt.done{background:#F2FBF9;border-color:#BFE6DF}
.kt-t{display:flex;justify-content:space-between;align-items:baseline}
.kt-n{font:700 14px var(--fh);color:var(--plum)}
.kt-p{font:800 18px var(--fh)}
.kt-b{height:6px;border-radius:999px;background:#F6E6EF;margin:6px 0}
.kt-b i{display:block;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold))}
.kt-f{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut)}
.kt-f b{color:var(--deep)}
.kt.done .kt-f span:first-child{color:var(--ok);font-weight:600}
.badges{gap:8px}.bd{padding:5px 10px;font-size:12.5px;border-radius:12px}.bd i{font-size:17px}

/* ---- টিম ব্যাটল ---- */
.battle{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bt{border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(180deg,#fff,#FFF7FB);position:relative}
.bt.mine{border:2px solid var(--pink);background:linear-gradient(135deg,#FFF0F7,#FFF8E2);box-shadow:0 10px 24px rgba(226,19,110,.15)}
.bt-r{position:absolute;top:10px;right:12px;font:800 20px var(--fh);color:var(--deep)}

<script>
/* =====================================================================
   Gazipur Central Dashboard — শেয়ার্ড কোড (Achievers' Club ও Market Service পেজ)
   ===================================================================== */
const GC = (function () {
'use strict';
const _gh = location.hostname.match(/^([^.]+)\.github\.io$/i);
const OWNER = _gh ? _gh[1] : 'ashekulmasom', REPO = _gh ? (location.pathname.split('/')[1] || 'Business-Dashboard') : 'Business-Dashboard';   // রিপোর নাম ওয়েব ঠিকানা থেকে নিজে বের করে
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MED = ['🥇', '🥈', '🥉'];

/* ---------- Achievers' Club ওজন ---------- */
/* [key, নাম, MTD/TTL, ওজন, ক্যাপ] — MTD: MTD টার্গেটের বিপরীতে, TTL: মোট মাসিক টার্গেটের বিপরীতে
   ক্যাপ: অর্জন % এর বেশি হলেও পয়েন্ট এই সীমা পর্যন্ত (KPI Wise Weightage and Capping শিট অনুযায়ী); N = ক্যাপ নেই */
const N_ = Infinity;
const LV = {
  dso: { lab: 'ডিএসও', ps: [['t', 'TRX', 'MTD', 30, 1.3], ['r', 'REG', 'MTD', 30, 1.5], ['vo', 'SAV-VOL', 'TTL', 10, 2], ['c', 'SAV-CNT', 'TTL', 10, 2], ['u', 'UBP', 'MTD', 20, 2]] },
  dss: { lab: 'ডিএসএস', ps: [['t', 'TRX', 'MTD', 30, N_], ['r', 'REG', 'MTD', 20, N_], ['vo', 'SAV-VOL', 'TTL', 10, 1.3], ['c', 'SAV-CNT', 'TTL', 10, 2.2], ['u', 'UBP', 'MTD', 25, N_], ['a', 'A2M', 'MTD', 5, 1.1]] },
  om: { lab: 'অপারেশন ম্যানেজার', ps: [['t', 'TRX', 'MTD', 30, N_], ['r', 'REG', 'MTD', 20, N_], ['vo', 'SAV-VOL', 'TTL', 5, 1.1], ['c', 'SAV-CNT', 'TTL', 5, 1.5], ['u', 'UBP', 'MTD', 20, N_], ['a', 'BZP (A2M+D2C)', 'MTD', 20, N_]] }
};
const capTxt = c => isFinite(c) ? Math.round(c * 100) + '% ক্যাপ' : 'ক্যাপ নেই';

/* ---------- টিমের নাম (ডিফল্ট; অ্যাডমিন সেটিংসে বদলানো যায়) ---------- */
const TEAMS = { 'JUWEL RANA': 'CHOWRASTA TIGERS', 'MD. SHAH ALAM': 'SALNA TITANS', 'MD. TOHIN HOSSAIN': 'KONABARI 7STARS', 'MORSHADUL': 'NAWJOR WARRIORS', 'MD. HAMIDUR RAHMAN': 'MIRZAPUR KINGS', 'MD. MOMINUL ISLAM': 'BAGHERBAZAR FIGHTERS', 'MD. SHAKIL HOSSAIN': 'BANGLABAZAR LIONS', 'MD. SHOIDUL HASAN': 'MONIPUR GLADIATORS' };
/* ---------- সহায়ক ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tc = s => String(s == null ? '' : s).trim().toLowerCase().replace(/(^|[\s.\-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
const up = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toUpperCase();
const norm = w => { w = String(w == null ? '' : w).replace(/[০-৯]/g, c => '০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[^\d]/g, ''); if (w.startsWith('880')) w = w.slice(2); if (w.length === 10) w = '0' + w; return w; };
const nf = n => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('en-IN');
const nd = n => n == null || !isFinite(n) ? '—' : (Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 10) / 10).toLocaleString('en-IN');
const pcCell = x => { const v = Math.round((x || 0) * 100); return `<td class="${v >= 100 ? 'hi' : v < 50 ? 'lo' : ''}">${v}%</td>`; };
const dt = s => new Date(String(s).slice(0, 10) + 'T00:00:00');
const fmtTill = s => { if (!s) return '—'; const d = dt(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const monLabel = m => { if (!m) return ''; const [y, mo] = m.split('-'); return `${MON[+mo - 1]} ${y}`; };

/* ---------- ডেটা লোড ---------- */
async function getJSON(path) {
  try { const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; }
}
async function loadIndex() {
  const j = await getJSON('index.json');
  return j && Array.isArray(j.months) ? j : { months: [], latest: '' };
}
function pickMonth(IDX) {
  const q = new URLSearchParams(location.search).get('m');
  let m = q || ss('gcd_m') || IDX.latest || IDX.months[0];
  if (!IDX.months.includes(m)) m = IDX.latest || IDX.months[0];
  return m;
}
async function loadMonth(m) {
  const D = await getJSON(`${m}.json`);
  if (!D) return null;
  prep(D);
  return D;
}

/* ---------- স্কোর ---------- */
const REPOF = { t: 'dtr', r: 'reg', u: 'ubp', vo: 'sav', c: 'sav', a: 'a2m' };
function tillOf(D, p, lv) {
  const T = D.tills || {}, base = D.tillDate || D.updated;
  const ok = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && s.slice(0, 7) === D.month;
  if (p === 'a' && lv === 'om') { const c = ['a2m', 'd2c'].map(k => T[k]).filter(ok).sort(); return c[0] || base; }
  const t = T[REPOF[p]];
  return ok(t) ? t : base;
}
function dayInfo(D, p, lv) {
  const tl = dt(tillOf(D, p, lv)), dim = new Date(tl.getFullYear(), tl.getMonth() + 1, 0).getDate(), day = tl.getDate();
  return { day, dim, left: dim - day, till: tillOf(D, p, lv) };
}
/* রেকর্ড থেকে প্যারামিটারের অর্জন, টার্গেট, গত মাস */
function vv(rec, p, lv) {
  const v = rec.v || {}, g = k => v[k] || {};
  const n = x => x == null ? null : x;

function start() {

  GC.header({ IDX, D, who, page: 'ms', title: 'MARKET SERVICE', till: SV && SV.till, onMonth });
  const src = sources();
  if (!src.some(s => s.id === tab)) tab = src.length ? src[0].id : 'crit';
  $('#stabs').innerHTML = src.map(s => `<a href="#" data-t="${esc(s.id)}" class="${s.id === tab ? 'on' : ''}">${esc(s.title)}</a>`).join('');
  $('#stabs').hidden = src.length < 2;
  document.querySelectorAll('#stabs a').forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.t; colF = {}; sortBy = null; document.querySelectorAll('#stabs a').forEach(x => x.classList.toggle('on', x === a)); draw(); });
  $('#fdh').innerHTML = '<option value="">সব ডিএইচ</option>' + D.dh.map(d => `<option value="${esc(d.name)}" ${who.myDH && who.myDH.name === d.name ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
  $('#fdh').onchange = () => { dssOpts(); draw(); }; $('#fdss').onchange = draw; $('#fq').oninput = draw;
  $('#clr').onclick = () => { $('#fdh').value = ''; $('#fq').value = ''; colF = {}; sortBy = null; dssOpts(); draw(); };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { level = b.dataset.l; colF = {}; sortBy = null; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  dssOpts(); draw();
}
function dssOpts() {
  const d = $('#fdh').value;
  $('#fdss').innerHTML = '<option value="">সব টিম / ডিএসএস</option>' + D.teams.filter(t => !d || t.dh === d).map(t => `<option value="${esc(t.dh + '\u0001' + t.dss)}">${esc(GC.tn(t))} (${esc(tc(t.dss))})${d ? '' : ' · ' + esc(t.dh)}</option>`).join('');
}

/* ---------- ফিল্টার: লেখা → ধারণ করে; সংখ্যা → >100, <=50, 0, 10-20 ---------- */
function match(val, f, isNum) {
  f = String(f || '').trim(); if (!f) return true;
  if (isNum) {
    const v = val == null ? NaN : +val; let m;
    if ((m = f.match(/^(>=|<=|>|<|=)?\s*(-?[\d.,]+)$/))) { const n = +m[2].replace(/,/g, ''); switch (m[1]) { case '>': return v > n; case '<': return v < n; case '>=': return v >= n; case '<=': return v <= n; default: return Math.abs(v - n) < 1e-9 || Math.round(v) === n; } }
    if ((m = f.match(/^(-?[\d.,]+)\s*-\s*(-?[\d.,]+)$/))) { const a = +m[1].replace(/,/g, ''), b = +m[2].replace(/,/g, ''); return v >= a && v <= b; }
  }
  return String(val == null ? '' : val).toLowerCase().includes(f.toLowerCase());
}
let _w = innerWidth < 700; addEventListener('resize', () => { const n = innerWidth < 700; if (n !== _w) { _w = n; if (D && who && !$('#app').hidden) draw(); } });
const fmtCell = (v, c) => v == null ? '—' : c.pct ? (Math.round(v * 10) / 10) + '%' : c.avg ? GC.nd(v) : GC.nf(v);

function draw() {
  const src = sources().find(s => s.id === tab);
  if (!src) { $('#tb').innerHTML = ''; $('#sub').textContent = `${GC.monLabel(D.month)}-এর মার্কেট সার্ভিস ডেটা এখনও প্রকাশ হয়নি।`; $('#leg').innerHTML = ''; return; }
  const d = $('#fdh').value, [sd, ss] = ($('#fdss').value || '').split('\u0001'), ed = d || sd || '', q = $('#fq').value.trim().toLowerCase();
  const my = who.myDH ? who.myDH.name : '';
  const rawDSS = t => D.ra.filter(x => x.dh === t.dh && x.dss === t.dss).reduce((a, x) => src.add(a, src.dso(x)), {});
  const rawDH = dh => src.add(D.teams.filter(t => t.dh === dh.name).reduce((a, t) => src.add(a, rawDSS(t)), {}), src.un(dh.name));
  let lead, rows = [];
  if (level === 'dh') {
    lead = ['ডিএইচ'];
    D.dh.filter(x => !ed || x.name === ed).forEach(x => rows.push({ k: [x.om ? x.om + ' · ' + x.name : x.name], r: rawDH(x), mine: x.name === my }));
  } else if (level === 'dss') {
    lead = ['টিম (ডিএসএস)', 'ডিএইচ'];
    D.teams.filter(t => (!ed || t.dh === ed) && (!ss || t.dss === ss)).forEach(t => rows.push({ k: [GC.tn(t) + (t.team ? ' (' + tc(t.dss) + ')' : ''), t.dh], r: rawDSS(t), mine: t.dh === my }));
    if (!ss) D.dh.filter(x => (!ed || x.name === ed) && src.un(x.name)).forEach(x => rows.push({ k: ['অনির্ধারিত আরএ', x.name], r: src.un(x.name), muted: true }));
  } else {
    lead = ['ডিএসও', 'আরএ ওয়ালেট', 'টিম (ডিএসএস)', 'ডিএইচ'];
    D.ra.filter(x => (!ed || x.dh === ed) && (!ss || x.dss === ss)).sort((a, b) => a.dh.localeCompare(b.dh) || a.dss.localeCompare(b.dss) || a.name.localeCompare(b.name))
      .forEach(x => rows.push({ k: [tc(x.name), x.wallet, (x.team || '') + (x.team ? ' (' + tc(x.dss) + ')' : tc(x.dss)), x.dh], r: src.dso(x), mine: x.dh === my }));
  }
  rows.forEach(x => { x.cells = src.cols.map(c => c.get(x.r)); x.full = x.k; });
  const fullLead = lead;
  if (innerWidth < 700 && lead.length > 1) {                       // মোবাইল: নাম কলাম একটিতে
    rows.forEach(x => { x.sub = x.full.slice(1).filter((v, i, arr) => v && !(ed && i === arr.length - 1)).join(' · '); x.k = [x.full[0]]; });
    lead = [lead[0]];
  }
  if (q) rows = rows.filter(x => x.full.join(' ').toLowerCase().includes(q));
  rows = rows.filter(x => x.k.every((v, i) => match(v, colF['k' + i], false)) && x.cells.every((v, i) => match(v, colF['c' + i], true)));
  if (sortBy) { const { key, dir } = sortBy; rows.sort((a, b) => { const va = key[0] === 'k' ? a.k[+key.slice(1)] : a.cells[+key.slice(1)], vb = key[0] === 'k' ? b.k[+key.slice(1)] : b.cells[+key.slice(1)]; return (typeof va === 'number' || typeof vb === 'number' ? ((va ?? -Infinity) - (vb ?? -Infinity)) : String(va).localeCompare(String(vb))) * dir; }); }
  const tot = rows.filter(x => !x.muted || true).reduce((a, x) => src.add(a, x.r), {});
  const totCells = src.cols.map(c => c.get(tot));
  const label = { dh: 'ডিএইচ', dss: 'টিম / ডিএসএস', dso: 'আরএ / ডিএসও' }[level];
  $('#ttl').textContent = `${src.title} · ${label}-ভিত্তিক`;
  $('#sub').textContent = `${GC.monLabel(D.month)} · ${src.sub} · ${rows.length}টি সারি`;
  const arrow = key => sortBy && sortBy.key === key ? (sortBy.dir > 0 ? ' ▲' : ' ▼') : '';
  const allCols = [...lead.map((n, i) => ({ key: 'k' + i, name: n, l: true })), ...src.cols.map((c, i) => ({ key: 'c' + i, name: c.name }))];
  let h = `<thead><tr>${allCols.map(c => `<th class="${c.l ? 'l' : ''}" data-sort="${c.key}" title="সাজাতে ক্লিক করুন">${esc(c.name)}${arrow(c.key)}</th>`).join('')}</tr>
    <tr class="frow">${allCols.map(c => `<th class="${c.l ? 'l' : ''}"><input data-f="${c.key}" value="${esc(colF[c.key] || '')}" placeholder="ফিল্টার" aria-label="${esc(c.name)} ফিল্টার"></th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(x => h += `<tr class="${x.mine && level !== 'dso' ? 'mine' : ''}" ${x.muted ? 'style="opacity:.75"' : ''}>${x.k.map((v, i) => `<td class="l">${i ? `<small>${esc(v)}</small>` : `<b>${esc(v)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}`}</td>`).join('')}${x.cells.map((v, i) => `<td>${fmtCell(v, src.cols[i])}</td>`).join('')}</tr>`);
  h += `</tbody><tfoot><tr class="tot"><td class="l">মোট (ফিল্টার অনুযায়ী)</td>${lead.slice(1).map(() => '<td></td>').join('')}${totCells.map((v, i) => `<td>${fmtCell(v, src.cols[i])}</td>`).join('')}</tr></tfoot>`;
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  $('#tb').innerHTML = h;
  document.querySelectorAll('#tb th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; sortBy = sortBy && sortBy.key === k ? (sortBy.dir > 0 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 }; draw(); });
  document.querySelectorAll('#tb input[data-f]').forEach(inp => inp.oninput = () => { colF[inp.dataset.f] = inp.value; draw(); });
  if (keep) { const el = document.querySelector(`#tb input[data-f="${keep}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  view = { allCols: [...fullLead.map((n, i) => ({ key: 'k' + i, name: n })), ...src.cols.map((c, i) => ({ key: 'c' + i, name: c.name }))], rows, totCells, src };
  $('#leg').innerHTML = src.legend() + '<p>এজেন্টের আরএ ধরা হয়েছে সর্বশেষ TRX রিপোর্ট থেকে। টার্গেট ফাইলে নেই এমন আরএ “অনির্ধারিত আরএ” হিসেবে ডিএইচ-এর মোটে যোগ হয়।</p>';
}
const OPN = { '=': '=', '!=': '≠', '>': '>', '>=': '≥', '<': '<', '<=': '≤', in: 'এর যেকোনো একটি', notin: 'এর কোনোটিই নয়', contains: 'ধারণ করে', empty: 'খালি', notempty: 'খালি নয়' };
function describe(c) {
  if (c.kind === 'pct') { const n = SV.crit.find(x => x.id === c.num), d = SV.crit.find(x => x.id === c.den); return `${n ? n.name : c.num} ÷ ${d ? d.name : c.den} × 100`; }
  const cs = (c.conds || []).map(x => `${x.f} ${OPN[x.op] || x.op}${['empty', 'notempty'].includes(x.op) ? '' : ' ' + x.v}`).join(' এবং ');
  return (c.kind === 'sum' ? `যোগফল: ${c.sumField}` : 'এজেন্ট সংখ্যা') + (cs ? ` — যেখানে ${cs}` : '');
}
/* ---------- Excel (ফিল্টার করা সারি, ফ্রিজ করা শিরোনাম ও প্রথম কলাম) ---------- */
$('#xl').onclick = () => {
  const go = () => {
    const { allCols, rows, totCells, src } = view;
    const aoa = [allCols.map(c => c.name)];
    rows.forEach(x => aoa.push([...x.full, ...x.cells.map((v, i) => v == null ? '' : src.cols[i].pct || src.cols[i].avg ? Math.round(v * 10) / 10 : v)]));
    aoa.push(['মোট', ...Array(allCols.length - src.cols.length - 1).fill(''), ...totCells.map((v, i) => v == null ? '' : src.cols[i].pct || src.cols[i].avg ? Math.round(v * 10) / 10 : v)]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 2, c: allCols.length - 1 } }) };
    ws['!cols'] = allCols.map((c, i) => ({ wch: i === 0 ? 28 : Math.max(10, Math.min(30, String(c.name).length + 2)) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Market Service');
    wb.Workbook = { Views: [{}] }; ws['!freeze'] = { xSplit: 1, ySplit: 1 };
    XLSX.writeFile(wb, `Market_Service_${level.toUpperCase()}_${src.till || D.month}.xlsx`);
  };
  if (window.XLSX) return go();
  const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = go; document.head.appendChild(s);
};

</script>
