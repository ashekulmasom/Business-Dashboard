<style>
:root{--pink:#E2136E;--deep:#A80B52;--bg:#FDF3F8;--line:#F0D3E2;--ink:#1B1B1F;--mut:#5C4A54;--ok:#0B5F58;--low:#92400E}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.55 "Hind Siliguri",system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,#FFE3F0 0,transparent 40%),radial-gradient(circle at 95% 15%,#FFEFD2 0,transparent 35%),var(--bg);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--pink),var(--deep));color:#fff;border-radius:24px;padding:22px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 14px 34px rgba(226,19,110,.32)}
.badge{background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.22);transform:rotate(-3deg);animation:bob 4s ease-in-out infinite}
.badge img{height:78px;display:block}
.hero h1{margin:0;font-size:30px;line-height:1.25;font-weight:700}
.hero p{margin:4px 0 0;font-size:15px;opacity:.95}
.till{display:inline-block;font:400 12px/1.4 system-ui,"Segoe UI",sans-serif;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;margin-top:6px}
.hero .side{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.hero select{min-height:40px;width:auto;border:2px solid #fff;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 12px;font:600 14px "Hind Siliguri",sans-serif}
.hero select option{color:#1B1B1F}
.sp{position:absolute;color:#FFE27A;animation:tw 2.4s ease-in-out infinite;pointer-events:none;font-size:20px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
nav.tabs a{padding:9px 18px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--deep);font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--pink);border-color:var(--pink);color:#fff}
.who{font-size:13px;color:var(--mut);margin-left:auto;align-self:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 14px rgba(226,19,110,.07)}
h2{font-size:21px;margin:0 0 2px}
.mut{color:var(--mut);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;transition:transform .2s,box-shadow .2s;position:relative;color:inherit;text-decoration:none;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(226,19,110,.16)}
.card .ic{font-size:28px}

.card.me{background:linear-gradient(135deg,#FFF0F7,#FFF7DD);border:2px solid var(--pink)}

.msg{margin-top:8px;font-weight:600;color:var(--deep);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;border:2px solid #D9B8C8;border-radius:12px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #FFC2DC;border-color:var(--pink)}
button,a.btn{min-height:48px;border-radius:999px;padding:10px 22px;font:700 15px "Hind Siliguri",sans-serif;cursor:pointer;border:2px solid var(--pink);background:var(--pink);color:#fff;transition:transform .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}

tr.top td{background:#FFF1C9;font-weight:600}
tr.mine td{background:#FFD9EA}tr.mine td:first-child{border-left:5px solid var(--pink)}
tr.tot td{background:#FDF3F8;font-weight:700}
td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--pink)}
.hi{color:var(--ok);font-weight:700}.lo{color:var(--low)}
.bar{height:6px;background:#F4E1EB;border-radius:3px;margin-top:3px;min-width:70px}.bar i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--pink),#FFB300)}
.rk{font-size:20px;line-height:1}
.dhh{margin:22px 0 6px;font-size:18px;color:var(--deep);font-weight:700}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 18px;flex-wrap:nowrap}

.gate{max-width:480px;margin:34px auto 0}

.seg button{border:0;border-radius:0;background:#fff;color:var(--pink);min-height:42px}
.seg button.on{background:var(--pink);color:#fff}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;font-weight:600;background:#FFE3F0;color:var(--deep)}
.cf{position:fixed;top:-16px;width:10px;height:14px;z-index:9;animation:fall 3.2s linear forwards;pointer-events:none}

@media (max-width:560px){.hero h1{font-size:23px}.badge img{height:60px}.hero{padding:18px}.hero .side{margin-left:0}}

<body>
<div class="wrap">
<section id="gate" class="gate">
  <div class="hero" style="flex-direction:column;align-items:flex-start;gap:14px">
    <div class="badge"><img src="logo.jpg" alt="Achievers’ Club" style="height:80px"></div>
    <div><h1>🛠️ Market Service</h1><p>গাজীপুর সেন্ট্রাল · শুধু অপারেশন ম্যানেজার ও অ্যাডমিন</p></div>
  </div>
  <form id="f" class="panel">
    <label for="w">MA ওয়ালেট নম্বর (অপারেশন ম্যানেজার)</label>
    <input id="w" inputmode="numeric" autocomplete="off" placeholder="01XXXXXXXXX">
    <div class="err" id="e" role="alert"></div>
    <button type="submit" style="width:100%">Market Service দেখুন</button>
  </form>
  <p class="mut"><a href="index.html" style="color:var(--pink)">← Achievers’ Club</a> · <a href="admin.html" style="color:var(--pink)">অ্যাডমিন সাইন ইন</a></p>
</section>

<section id="app" hidden>
  <div id="hdr"></div>
  <div class="panel filters">
    <div><label for="fdh">🏢 ডিএইচ</label><select id="fdh"></select></div>
    <div><label for="fdss">👥 ডিএসএস</label><select id="fdss"></select></div>
    <div style="flex:0 0 auto"><button class="ghost" id="xl" type="button">⬇️ Excel ডাউনলোড</button></div>
  </div>
  <div class="panel">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <h2 id="ttl">📋 মার্কেট সার্ভিস</h2>
      <div class="seg" role="group" aria-label="রিপোর্টের স্তর"><button type="button" data-l="dh">ডিএইচ</button><button type="button" data-l="dss">ডিএসএস</button><button type="button" data-l="dso" class="on">ডিএসও</button></div>
    </div>
    <div class="mut" id="sub" style="margin:4px 0 10px"></div>
    <div class="scroll"><table id="tb"></table></div>
  </div>
  <div class="panel"><h2>ℹ️ কোন সংখ্যা কীভাবে</h2><div id="leg" class="mut"></div></div>
</section>

<script>
/* =====================================================================
   Gazipur Central Dashboard — শেয়ার্ড কোড (Achievers' Club ও Market Service পেজ)
   ===================================================================== */
const GC = (function () {
'use strict';
const OWNER = 'ashekulmasom', REPO = 'Gazipur-Central-Dashboard';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MED = ['🥇', '🥈', '🥉'];

/* ---------- Achievers' Club ওজন ---------- */
/* [key, নাম, MTD/TTL, ওজন] — MTD: MTD টার্গেটের বিপরীতে, TTL: মোট মাসিক টার্গেটের বিপরীতে */
const LV = {
  dso: { lab: 'ডিএসও', ps: [['t', 'TRX', 'MTD', 30], ['r', 'REG', 'MTD', 30], ['vo', 'SAV-VOL', 'TTL', 10], ['c', 'SAV-CNT', 'TTL', 10], ['u', 'UBP', 'MTD', 20]] },
  dss: { lab: 'ডিএসএস', ps: [['t', 'TRX', 'MTD', 30], ['r', 'REG', 'MTD', 20], ['vo', 'SAV-VOL', 'TTL', 10], ['c', 'SAV-CNT', 'TTL', 10], ['u', 'UBP', 'MTD', 25], ['a', 'A2M', 'MTD', 5]] },
  om: { lab: 'অপারেশন ম্যানেজার', ps: [['t', 'TRX', 'MTD', 30], ['r', 'REG', 'MTD', 20], ['vo', 'SAV-VOL', 'TTL', 7.5], ['c', 'SAV-CNT', 'TTL', 7.5], ['u', 'UBP', 'MTD', 20], ['a', 'BZP (A2M+D2C)', 'MTD', 15]] }
};

/* ---------- সহায়ক ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tc = s => String(s == null ? '' : s).trim().toLowerCase().replace(/(^|[\s.\-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
const up = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toUpperCase();
const norm = w => { w = String(w == null ? '' : w).replace(/[০-৯]/g, c => '০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[^\d]/g, ''); if (w.startsWith('880')) w = w.slice(2); if (w.length === 10) w = '0' + w; return w; };
const nf = n => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('en-IN');
const nd = n => n == null || !isFinite(n) ? '—' : (Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 10) / 10).toLocaleString('en-IN');
const pcCell = x => { const v = Math.round((x || 0) * 100); return `<td class="${v >= 100 ? 'hi' : v < 50 ? 'lo' : ''}">${v}%</td>`; };
const dt = s => new Date(String(s).slice(0, 10) + 'T00:00:00');
const fmtTill = s => { if (!s) return '—'; const d = dt(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const monLabel = m => { if (!m) return ''; const [y, mo] = m.split('-'); return `${MON[+mo - 1]} ${y}`; };

/* ---------- ডেটা লোড ---------- */
async function getJSON(path) {
  try { const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; }
}
async function loadIndex() {
  const j = await getJSON('index.json');
  return j && Array.isArray(j.months) ? j : { months: [], latest: '' };
}
function pickMonth(IDX) {
  const q = new URLSearchParams(location.search).get('m');
  let m = q || ss('gcd_m') || IDX.latest || IDX.months[0];
  if (!IDX.months.includes(m)) m = IDX.latest || IDX.months[0];
  return m;
}
async function loadMonth(m) {
  const D = await getJSON(`${m}.json`);
  if (!D) return null;
  prep(D);
  return D;
}

/* ---------- স্কোর ---------- */
const REPOF = { t: 'dtr', r: 'reg', u: 'ubp', vo: 'sav', c: 'sav', a: 'a2m' };
function tillOf(D, p, lv) {
  const T = D.tills || {}, base = D.tillDate || D.updated;
  const ok = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && s.slice(0, 7) === D.month;
  if (p === 'a' && lv === 'om') { const c = ['a2m', 'd2c'].map(k => T[k]).filter(ok).sort(); return c[0] || base; }
  const t = T[REPOF[p]];
  return ok(t) ? t : base;
}
function dayInfo(D, p, lv) {
  const tl = dt(tillOf(D, p, lv)), dim = new Date(tl.getFullYear(), tl.getMonth() + 1, 0).getDate(), day = tl.getDate();
  return { day, dim, left: dim - day, till: tillOf(D, p, lv) };
}
/* রেকর্ড থেকে প্যারামিটারের অর্জন, টার্গেট, গত মাস */
function vv(rec, p, lv) {
  const v = rec.v || {}, g = k => v[k] || {};
  const n = x => x == null ? null : x;
  if (p === 'a') {
    if (lv !== 'om') return { ach: n(g('a2m').ach), trg: n(g('a2m').trg), lm: null };
    const a = g('a2m'), d = g('d2c');
    return {
      ach: (a.ach == null && d.ach == null) ? null : (a.ach || 0) + (d.ach || 0),
      trg: (a.trg == null && d.trg == null) ? null : (a.trg || 0) + (d.trg || 0),
      lm: null, a2m: a.ach, d2c: d.ach, a2mT: a.trg, d2cT: d.trg
    };
  }
  return { ach: n(g(p).ach), trg: n(g(p).trg), lm: n(g(p).lm) };
}
function frac(D, rec, lv, p, basis) {
  const { ach, trg } = vv(rec, p, lv);
  if (!(trg > 0)) return 0;
  const { day, dim } = dayInfo(D, p, lv);
  return (ach || 0) / (basis === 'MTD' ? trg * day / dim : trg);
}
/* স্কোর = Σ ওজন × min(অর্জন %, ১০০%) */
function compute(D) {
  const run = (rec, lv) => { let s = 0; LV[lv].ps.forEach(([p, , b, w]) => { const f = frac(D, rec, lv, p, b); rec[p] = f; s += w * Math.min(f, 1); }); rec.score = s; };
  const rankIn = (arr, key, set) => [...new Set(arr.map(key))].forEach(g => arr.filter(x => key(x) === g).sort((a, b) => b.score - a.score).forEach((x, i) => x[set] = i + 1));
  D.ra.forEach(x => run(x, 'dso'));
  D.teams.forEach(x => run(x, 'dss'));
  D.dh.forEach(x => run(x, 'om'));
  run(D.territory, 'om');
  rankIn(D.ra, x => x.dh, 'dhRank');
  rankIn(D.ra, x => x.dh + '\u0001' + x.dss, 'teamRank');
  [...D.ra].sort((a, b) => b.score - a.score).forEach((x, i) => x.allRank = i + 1);
  [...D.teams].sort((a, b) => b.score - a.score).forEach((x, i) => x.rank = i + 1);   // ডিএসএস: পুরো টেরিটরিতে এক র‍্যাঙ্ক
  [...D.dh].sort((a, b) => b.score - a.score).forEach((x, i) => x.rank = i + 1);
}
function prep(D) {
  D.ra = D.ra || []; D.teams = D.teams || []; D.dh = D.dh || []; D.tills = D.tills || {};
  D.ra.forEach(x => { x.dh = up(x.dh); x.dss = String(x.dss).replace(/\s+/g, ' ').trim(); });
  D.teams.forEach(x => { x.dh = up(x.dh); x.dss = String(x.dss).replace(/\s+/g, ' ').trim(); });
  D.dh.forEach(x => x.name = up(x.name));
  D.territory = D.territory || { v: {} };
  compute(D);
}

/* ---------- সেশন ও লগইন ---------- */
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { } return null; }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } return null; }
function session() { try { return JSON.parse(ss('gcd_s') || 'null'); } catch (e) { return null; } }
function setSession(s) { ss('gcd_s', s ? JSON.stringify(s) : null); }
/* অ্যাডমিন: অ্যাডমিন পেজে টোকেন দিয়ে সাইন ইন করলে, অথবা এই কম্পিউটারে মনে রাখা টোকেন বৈধ হলে */
async function adminCheck() {
  if (ss('gcd_admin') === '1') return true;
  const t = ls('gt'); if (!t) return false;
  try {
    const r = await fetch(API, { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' } });
    const j = await r.json();
    if (r.ok && j.permissions && j.permissions.push) { ss('gcd_admin', '1'); return true; }
  } catch (e) { }
  return false;
}
/* ওয়ালেট → ভূমিকা: ডিএসও (আরএ ওয়ালেট) বা ওএম (ডিস্ট্রিবিউটরের MA ওয়ালেট) */
function identify(D, w) {
  const n = norm(w); if (n.length !== 11) return null;
  const ra = D.ra.find(r => norm(r.wallet) === n); if (ra) return { role: 'dso', w: n };
  const dh = D.dh.find(d => d.ma && norm(d.ma) === n); if (dh) return { role: 'om', w: n };
  return null;
}
function resolve(D, s, isAdmin) {
  if (isAdmin) return { role: 'admin', me: null, myDH: null };
  if (!s) return null;
  const n = norm(s.w);
  const me = D.ra.find(r => norm(r.wallet) === n) || null;
  const myDH = D.dh.find(d => d.ma && norm(d.ma) === n) || null;
  if (me) return { role: 'dso', me, myDH: null };
  if (myDH) return { role: 'om', me: null, myDH };
  if (s.role) return { role: s.role, me: null, myDH: null, missing: true };
  return null;
}
function signOut() { setSession(null); ss('gcd_admin', null); location.href = 'index.html'; }

/* ---------- হেডার ও নেভিগেশন ---------- */
function header(o) {
  const months = (o.IDX.months || []).slice().sort().reverse();
  const roleLab = { dso: 'ডিএসও', om: 'অপারেশন ম্যানেজার', admin: 'অ্যাডমিন' }[o.who.role] || '';
  const name = o.who.me ? tc(o.who.me.name) : o.who.myDH ? o.who.myDH.name : '';
  $('#hdr').innerHTML = `
  <header class="hero">
    <span class="sp" style="top:10px;left:46%">✦</span><span class="sp" style="top:54px;left:58%;animation-delay:.7s;font-size:14px">★</span><span class="sp" style="bottom:12px;left:40%;animation-delay:1.3s">✦</span>
    <div class="badge"><img src="logo.jpg" alt="Achievers’ Club"></div>
    <div><h1>${esc(o.title)}</h1><span class="till">${esc(monLabel(o.D.month))} · Till ${esc(fmtTill(o.till || o.D.tillDate))}</span></div>
    <div class="side">
      ${months.length > 1 ? `<label class="mut" for="msel" style="color:#fff;margin:0">মাস</label><select id="msel" aria-label="মাস বেছে নিন">${months.map(m => `<option value="${m}" ${m === o.D.month ? 'selected' : ''}>${monLabel(m)}</option>`).join('')}</select>` : ''}
      <button class="ghost" id="out" type="button">সাইন আউট</button>
    </div>
  </header>
  <nav class="tabs" aria-label="পেজ">
    <a href="index.html" class="${o.page === 'ac' ? 'on' : ''}">🏆 Achievers’ Club</a>
    ${o.who.role === 'om' || o.who.role === 'admin' ? `<a href="service.html" class="${o.page === 'ms' ? 'on' : ''}">🛠️ Market Service</a>` : ''}
    ${o.who.role === 'admin' ? `<a href="admin.html">⚙️ অ্যাডমিন</a>` : ''}
    <span class="who">${esc(roleLab)}${name ? ' · ' + esc(name) : ''}</span>
  </nav>`;
  $('#out').onclick = signOut;
  const ms = $('#msel'); if (ms) ms.onchange = () => { ss('gcd_m', ms.value); o.onMonth(ms.value); };
}
function head(a, n = 1) { return '<tr>' + a.map((h, i) => `<th class="${i < n ? 'l' : ''}">${h}</th>`).join('') + '</tr>'; }
function confetti(n) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#E2136E', '#FFB300', '#0B9C8F', '#FF6FA8', '#7C4DFF'];
  for (let i = 0; i < n; i++) { const s = document.createElement('span'); s.className = 'cf'; s.style.left = Math.random() * 100 + 'vw'; s.style.background = cols[i % 5]; s.style.animationDelay = Math.random() * .8 + 's'; s.style.animationDuration = 2.4 + Math.random() * 1.6 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 5000); }
}

return { OWNER, REPO, API, MON, MED, LV, REPOF, $, esc, tc, up, norm, nf, nd, pcCell, dt, fmtTill, monLabel, getJSON, loadIndex, pickMonth, loadMonth, prep, compute, vv, frac, dayInfo, tillOf, ss, ls, session, setSession, adminCheck, identify, resolve, signOut, header, head, confetti };
})();
</script>
<script>
const {$, esc, tc} = GC;
let IDX, D, SV, who, level = 'dso', view = { cols: [], rows: [] };

(async function init() {
  IDX = await GC.loadIndex();
  if (!IDX.months.length) { $('#e').textContent = 'এখনও কোনো ডেটা প্রকাশ হয়নি।'; return; }
  await load(GC.pickMonth(IDX));
  const admin = await GC.adminCheck();
  who = GC.resolve(D, GC.session(), admin);
  if (who && (who.role === 'om' || who.role === 'admin')) start();
  else if (who) $('#e').textContent = 'Market Service শুধু অপারেশন ম্যানেজার (MA ওয়ালেট) ও অ্যাডমিনের জন্য।';
})();
async function load(m) {
  D = await GC.loadMonth(m);
  SV = await GC.getJSON(`${m}-service.json`);
}
$('#f').addEventListener('submit', e => {
  e.preventDefault();
  if (!D) return;
  const s = GC.identify(D, $('#w').value);
  if (!s) { $('#e').textContent = 'ওয়ালেট নম্বরটি পাওয়া যায়নি।'; return; }
  if (s.role !== 'om') { $('#e').textContent = 'এটি ডিএসও ওয়ালেট। Market Service শুধু অপারেশন ম্যানেজারের MA ওয়ালেট দিয়ে দেখা যায়।'; return; }
  GC.setSession(s); who = GC.resolve(D, s, false); start();
});
async function onMonth(m) { await load(m); who = GC.resolve(D, GC.session(), GC.ss('gcd_admin') === '1'); start(); }

function start() {
  $('#gate').hidden = true; $('#app').hidden = false;
  GC.header({ IDX, D, who, page: 'ms', title: 'Market Service', till: SV && SV.till, onMonth });
  const dhs = D.dh.map(d => d.name);
  $('#fdh').innerHTML = '<option value="">সব ডিএইচ</option>' + dhs.map(d => `<option value="${esc(d)}" ${who.myDH && who.myDH.name === d ? 'selected' : ''}>${esc(d)}</option>`).join('');
  $('#fdh').onchange = () => { dssOpts(); draw(); }; $('#fdss').onchange = draw;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { level = b.dataset.l; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  dssOpts(); draw();
}
function dssOpts() {
  const d = $('#fdh').value;
  $('#fdss').innerHTML = '<option value="">সব ডিএসএস</option>' + D.teams.filter(t => !d || t.dh === d).map(t => `<option value="${esc(t.dh + '\u0001' + t.dss)}">${esc(tc(t.dss))}${d ? '' : ' · ' + esc(t.dh)}</option>`).join('');
}

/* ---------- হিসাব ---------- */
const crit = () => SV.crit.filter(c => c.show !== false);
function add(a, b) { for (const k in b || {}) a[k] = (a[k] || 0) + (b[k] || 0); return a; }
function val(raw, c) {
  if (c.kind === 'pct') { const n = raw[c.num] || 0, d = raw[c.den] || 0; return d ? n / d * 100 : null; }
  return raw[c.id] || 0;
}
const cell = (v, c) => c.kind === 'pct' ? (v == null ? '—' : (Math.round(v * 10) / 10) + '%') : GC.nf(v);
const raDSO = x => (SV.rows || {})[x.wallet] || {};
const rawDSS = t => D.ra.filter(x => x.dh === t.dh && x.dss === t.dss).reduce((a, x) => add(a, raDSO(x)), {});
const rawDH = d => add(D.teams.filter(t => t.dh === d.name).reduce((a, t) => add(a, rawDSS(t)), {}), (SV.un || {})[d.name]);

function draw() {
  if (!SV) { $('#tb').innerHTML = ''; $('#sub').textContent = `${GC.monLabel(D.month)}-এর মার্কেট সার্ভিস ডেটা এখনও প্রকাশ হয়নি। অ্যাডমিন TRX রিপোর্ট আপলোড করে প্রকাশ করলে দেখা যাবে।`; $('#leg').textContent = ''; return; }
  const C = crit();
  const d = $('#fdh').value, [sd, ss] = ($('#fdss').value || '').split('\u0001'), ed = d || sd || '';
  const my = who.myDH ? who.myDH.name : '';
  let lead = [], rows = [], tot = {};
  if (level === 'dh') {
    lead = ['ডিএইচ'];
    D.dh.filter(x => !ed || x.name === ed).forEach(x => { const r = rawDH(x); add(tot, r); rows.push({ k: [x.name], r, mine: x.name === my }); });
  } else if (level === 'dss') {
    lead = ['ডিএসএস', 'ডিএইচ'];
    D.teams.filter(t => (!ed || t.dh === ed) && (!ss || t.dss === ss)).forEach(t => { const r = rawDSS(t); add(tot, r); rows.push({ k: [tc(t.dss), t.dh], r, mine: t.dh === my }); });
    if (!ss) D.dh.filter(x => (!ed || x.name === ed) && SV.un && SV.un[x.name]).forEach(x => { rows.push({ k: ['অনির্ধারিত আরএ', x.name], r: SV.un[x.name], muted: true }); add(tot, SV.un[x.name]); });
  } else {
    lead = ['ডিএসও', 'ডিএসএস', 'ডিএইচ'];
    D.ra.filter(x => (!ed || x.dh === ed) && (!ss || x.dss === ss)).sort((a, b) => a.dh.localeCompare(b.dh) || a.dss.localeCompare(b.dss) || a.name.localeCompare(b.name))
      .forEach(x => { const r = raDSO(x); add(tot, r); rows.push({ k: [tc(x.name), tc(x.dss), x.dh], r, mine: x.dh === my, w: x.wallet }); });
  }
  const label = { dh: 'ডিএইচ', dss: 'ডিএসএস', dso: 'ডিএসও' }[level];
  $('#ttl').textContent = `📋 ${label}-ভিত্তিক মার্কেট সার্ভিস`;
  $('#sub').textContent = `${GC.monLabel(D.month)} · TRX রিপোর্ট Till ${GC.fmtTill(SV.till)} · মোট ${GC.nf(SV.agents)}টি এজেন্ট বিশ্লেষণ করা হয়েছে`;
  let h = GC.head([...lead, ...C.map(c => esc(c.name))], lead.length);
  rows.forEach(x => h += `<tr class="${x.mine && level !== 'dso' ? 'mine' : ''}" ${x.muted ? 'style="opacity:.75"' : ''}>${x.k.map((v, i) => `<td class="l">${i ? `<small>${esc(v)}</small>` : esc(v)}</td>`).join('')}${C.map(c => `<td>${cell(val(x.r, c), c)}</td>`).join('')}</tr>`);
  h += `<tr class="tot"><td class="l" colspan="${lead.length}">মোট${ed ? ' · ' + esc(ss ? tc(ss) : ed) : ' · গাজীপুর সেন্ট্রাল'}</td>${C.map(c => `<td>${cell(val(tot, c), c)}</td>`).join('')}</tr>`;
  $('#tb').innerHTML = h;
  view = { lead, C, rows, tot };
  $('#leg').innerHTML = '<ul style="padding-left:18px;margin:0">' + C.map(c => `<li><b>${esc(c.name)}:</b> ${esc(describe(c))}</li>`).join('') + '</ul><p>এজেন্টের আরএ ধরা হয়েছে সর্বশেষ TRX রিপোর্ট থেকে। টার্গেট ফাইলে নেই এমন আরএ-র এজেন্ট “অনির্ধারিত আরএ” হিসেবে ডিএইচ-এর মোটে যোগ হয়।</p>';
}
const OPN = { '=': '=', '!=': '≠', '>': '>', '>=': '≥', '<': '<', '<=': '≤', in: 'এর যেকোনো একটি', notin: 'এর কোনোটিই নয়', contains: 'ধারণ করে', empty: 'খালি', notempty: 'খালি নয়' };
function describe(c) {
  if (c.kind === 'pct') { const n = SV.crit.find(x => x.id === c.num), d = SV.crit.find(x => x.id === c.den); return `${n ? n.name : c.num} ÷ ${d ? d.name : c.den} × 100`; }
  const cs = (c.conds || []).map(x => `${x.f} ${OPN[x.op] || x.op}${['empty', 'notempty'].includes(x.op) ? '' : ' ' + x.v}`).join(' এবং ');
  return (c.kind === 'sum' ? `যোগফল: ${c.sumField}` : 'এজেন্ট সংখ্যা') + (cs ? ` — যেখানে ${cs}` : '');
}
/* ---------- Excel ---------- */
$('#xl').onclick = () => {
  const go = () => {
    const aoa = [[...view.lead, ...view.C.map(c => c.name)]];
    view.rows.forEach(x => aoa.push([...x.k, ...view.C.map(c => { const v = val(x.r, c); return v == null ? '' : c.kind === 'pct' ? Math.round(v * 10) / 10 : v; })]));
    aoa.push(['মোট', ...Array(view.lead.length - 1).fill(''), ...view.C.map(c => { const v = val(view.tot, c); return v == null ? '' : c.kind === 'pct' ? Math.round(v * 10) / 10 : v; })]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Market Service');
    XLSX.writeFile(wb, `Market_Service_${level.toUpperCase()}_${SV.till || D.month}.xlsx`);
  };
  if (window.XLSX) return go();
  const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = go; document.head.appendChild(s);
};
</script>
